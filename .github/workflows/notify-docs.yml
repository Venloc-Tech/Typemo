name: Notify the docs site

# The documentation site (Venloc-Tech/Typemo-Consify) renders docs/ of this repository and compiles its examples
# against the packages of the same commit, so it is rebuilt when either changes.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "packages/*/src/**"
      - "integrations/*/src/**"
  workflow_dispatch:

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      # DOCS_DISPATCH_TOKEN: a fine-grained token with Contents read and write on Venloc-Tech/Typemo-Consify only.
      - name: Send typemo-docs to the site repository
        env:
          GH_TOKEN: ${{ secrets.DOCS_DISPATCH_TOKEN }}
        run: |
          gh api repos/Venloc-Tech/Typemo-Consify/dispatches \
            -f event_type=typemo-docs \
            -f "client_payload[sha]=${{ github.sha }}"
