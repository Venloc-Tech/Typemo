# Single-node replica set for the Typemo benchmarks (from-mongoose-to-typemo/BENCHMARKS-PLAN.md §8).
# Start:  docker compose -f packages/bench/docker/compose.yaml up -d
# Stop:   docker compose -f packages/bench/docker/compose.yaml down -v
# The harness initiates the replica set on first connect (MongoSetup.ensureReplicaSet).
# Image pinned to the newest official tag found by `docker pull mongo:latest` on 2026-09-27.
name: typemo-bench
services:
  mongo:
    image: mongo:8.3.11
    container_name: typemo-bench-mongo
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--port", "27017", "--quiet", "--wiredTigerCacheSizeGB", "2", "--setParameter", "enableTestCommands=1"]
    ports:
      - "27117:27017"
    # A named volume (not tmpfs): profiles full/heavy need L/XL datasets (1M–5M documents).
    volumes:
      - typemo-bench-data:/data/db
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 2s
      timeout: 5s
      retries: 30
volumes:
  typemo-bench-data:
